<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap">
  <style>
    body { margin: 0; font-family: "Instrument Sans", -apple-system, system-ui, sans-serif; }
    a { color: #5B4BFF; } a:hover { color: #4938E8; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F6F8; display: flex; flex-direction: column; gap: 20px;">

  <div style="padding: 18px 24px 0 24px;">
    <div style="font-size: 34px; font-weight: 600; letter-spacing: -0.028em; color: #1B1E23;">Passport</div>
  </div>

  <!-- The cover: a document, not a dashboard. Deep ink, letterpress rule, guilloché edge. -->
  <div style="margin: 0 24px; border-radius: 28px; background: linear-gradient(155deg,#22252C 0%,#16181D 60%,#1B1E23 100%); padding: 22px; position: relative; overflow: hidden;">
    <div style="position: absolute; right: -50px; top: -50px; width: 210px; height: 210px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.07);"></div>
    <div style="position: absolute; right: -24px; top: -24px; width: 160px; height: 160px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.05);"></div>
    <div style="position: absolute; right: 22px; top: 22px; width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle, rgba(91,75,255,0.42) 0%, rgba(91,75,255,0) 70%);"></div>

    <div style="display: flex; flex-direction: column; gap: 20px; position: relative;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.20em; color: rgba(255,255,255,0.52);">LEARNING PASSPORT</div>
        <div style="font-size: 27px; font-weight: 600; letter-spacing: -0.018em; color: #fff;">Alex Chen</div>
      </div>

      <div style="height: 1px; background: rgba(255,255,255,0.12);"></div>

      <div style="display: flex;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 23px; font-weight: 600; color: #fff;">47</div>
          <div style="font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.50);">CONCEPTS</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 23px; font-weight: 600; color: #fff;">31</div>
          <div style="font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.50);">LEARNED</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 23px; font-weight: 600; color: #fff;">6</div>
          <div style="font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.50);">SUBJECTS</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 23px; font-weight: 600; color: #fff;">126</div>
          <div style="font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.50);">SESSIONS</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Stamps: pressed, rotated, collectible -->
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div style="padding: 0 24px; display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 21px; font-weight: 600; letter-spacing: -0.02em; color: #1B1E23;">Stamps</div>
      <div style="font-size: 13px; color: #868C97;">31 earned</div>
    </div>
    <div style="display: flex; gap: 14px; padding: 4px 24px;">
      <div style="width: 96px; height: 96px; border-radius: 50%; background: #fff; border: 1.5px dashed rgba(91,75,255,0.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transform: rotate(-6deg); flex-shrink: 0; box-shadow: 0 2px 10px rgba(27,30,35,0.05);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5B4BFF" stroke-width="2" stroke-linejoin="round"><path d="M12 2.6l2.3 1.7 2.8-.3 1 2.7 2.4 1.5-.9 2.7.9 2.7-2.4 1.5-1 2.7-2.8-.3L12 21.4l-2.3-1.7-2.8.3-1-2.7L3.5 15.8l.9-2.7-.9-2.7 2.4-1.5 1-2.7 2.8.3z"/><path d="m9 12 2 2 4-4" stroke-linecap="round"/></svg>
        <div style="font-size: 11.5px; font-weight: 700; color: #5B4BFF; text-align: center; line-height: 1.15;">Derivatives</div>
        <div style="font-size: 7.5px; font-weight: 600; color: rgba(91,75,255,0.7); letter-spacing: 0.04em;">LEARNED</div>
      </div>
      <div style="width: 96px; height: 96px; border-radius: 50%; background: #fff; border: 1.5px dashed rgba(224,133,12,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transform: rotate(4deg); flex-shrink: 0; box-shadow: 0 2px 10px rgba(27,30,35,0.05);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#E0850C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h2.5a2.5 2.5 0 0 1 0 5H17M7 5H4.5a2.5 2.5 0 0 0 0 5H7M9 20h6M12 14v6"/></svg>
        <div style="font-size: 11.5px; font-weight: 700; color: #E0850C; text-align: center; line-height: 1.15;">10 Learned</div>
        <div style="font-size: 7.5px; font-weight: 600; color: rgba(224,133,12,0.75); letter-spacing: 0.04em;">MILESTONE</div>
      </div>
      <div style="width: 96px; height: 96px; border-radius: 50%; background: #fff; border: 1.5px dashed rgba(91,75,255,0.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transform: rotate(-3deg); flex-shrink: 0; box-shadow: 0 2px 10px rgba(27,30,35,0.05);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5B4BFF" stroke-width="2" stroke-linejoin="round"><path d="M12 2.6l2.3 1.7 2.8-.3 1 2.7 2.4 1.5-.9 2.7.9 2.7-2.4 1.5-1 2.7-2.8-.3L12 21.4l-2.3-1.7-2.8.3-1-2.7L3.5 15.8l.9-2.7-.9-2.7 2.4-1.5 1-2.7 2.8.3z"/><path d="m9 12 2 2 4-4" stroke-linecap="round"/></svg>
        <div style="font-size: 11.5px; font-weight: 700; color: #5B4BFF; text-align: center; line-height: 1.15;">Big-O</div>
        <div style="font-size: 7.5px; font-weight: 600; color: rgba(91,75,255,0.7); letter-spacing: 0.04em;">LEARNED</div>
      </div>
    </div>
  </div>

  <!-- Subject page -->
  <div style="padding: 0 24px; display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 21px; font-weight: 600; letter-spacing: -0.02em; color: #1B1E23;">Subjects</div>
    <div style="background: #fff; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(27,30,35,0.04);">
      <div style="display: flex; align-items: center; gap: 9px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B4BFF" stroke-width="2" stroke-linecap="round"><path d="M4 19c2 0 3-1.4 3.6-4.2L9.4 6.6C9.9 4.2 10.9 3 12.7 3c1 0 1.8.4 2.3 1M7 11h7"/></svg>
        <div style="font-size: 16.5px; font-weight: 600; color: #1B1E23; flex-grow: 1;">Mathematics</div>
        <div style="font-size: 12px; color: #868C97;">12 / 18</div>
      </div>
      <div style="height: 6px; border-radius: 999px; background: #ECEEF1; overflow: hidden;">
        <div style="width: 67%; height: 100%; border-radius: 999px; background: linear-gradient(90deg,#5B4BFF,#2D6BFF);"></div>
      </div>
      <div style="display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px solid rgba(27,30,35,0.06);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#0F9D58"><circle cx="12" cy="12" r="10"/><path d="m8 12 2.6 2.6L16 9.2" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div style="font-size: 14px; color: #1B1E23; flex-grow: 1;">Derivatives</div>
          <div style="font-size: 11.5px; font-weight: 500; color: #0F9D58;">Mastered</div>
        </div>
        <div style="display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px solid rgba(27,30,35,0.06);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B4BFF" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="#5B4BFF" stroke="none"/></svg>
          <div style="font-size: 14px; color: #1B1E23; flex-grow: 1;">The Chain Rule</div>
          <div style="font-size: 11.5px; font-weight: 500; color: #5B4BFF;">Practiced</div>
        </div>
        <div style="display: flex; align-items: center; gap: 9px; padding: 8px 0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B0B5BF" stroke-width="2" stroke-dasharray="3 3"><circle cx="12" cy="12" r="9"/></svg>
          <div style="font-size: 14px; color: #1B1E23; flex-grow: 1;">Integrals</div>
          <div style="font-size: 11.5px; font-weight: 500; color: #B0B5BF;">Discovered</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

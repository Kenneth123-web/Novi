<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap">
  <style>
    body { margin: 0; font-family: "Instrument Sans", -apple-system, system-ui, sans-serif; }
    a { color: #5B4BFF; } a:hover { color: #4938E8; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F6F8;">

  <!-- Aurora: three radial fields, the only place in the app the palette breathes -->
  <div style="position: absolute; inset: 0;">
    <div style="position: absolute; width: 560px; height: 560px; left: -120px; top: -80px; border-radius: 50%; background: radial-gradient(circle, rgba(91,75,255,0.42) 0%, rgba(91,75,255,0) 68%);"></div>
    <div style="position: absolute; width: 440px; height: 440px; left: 200px; top: 90px; border-radius: 50%; background: radial-gradient(circle, rgba(45,107,255,0.34) 0%, rgba(45,107,255,0) 68%);"></div>
    <div style="position: absolute; width: 620px; height: 620px; left: -40px; top: 430px; border-radius: 50%; background: radial-gradient(circle, rgba(201,207,214,0.62) 0%, rgba(201,207,214,0) 70%);"></div>
  </div>

  <!-- Mark + wordmark, optically centred slightly above true centre -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding-bottom: 60px;">

    <div style="position: relative; width: 132px; height: 132px;">
      <!-- the lock-in ring -->
      <div style="position: absolute; inset: -8px; border-radius: 50%; border: 1.5px solid rgba(91,75,255,0.30);"></div>
      <!-- the concept constellation: scattered nodes that connect -->
      <svg viewBox="0 0 132 132" width="132" height="132" fill="none">
        <g stroke="#1B1E23" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
          <path d="M26 96 L52 58"/>
          <path d="M52 58 L66 22"/>
          <path d="M52 58 L96 74"/>
          <path d="M96 74 L110 36"/>
          <path d="M26 96 L78 108"/>
          <path d="M78 108 L96 74"/>
        </g>
        <g>
          <circle cx="52" cy="58" r="9" fill="#5B4BFF"/>
          <circle cx="26" cy="96" r="5.5" fill="#1B1E23"/>
          <circle cx="66" cy="22" r="5.5" fill="#1B1E23"/>
          <circle cx="96" cy="74" r="6.5" fill="#1B1E23"/>
          <circle cx="110" cy="36" r="4.5" fill="#1B1E23"/>
          <circle cx="78" cy="108" r="4.5" fill="#1B1E23"/>
        </g>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div style="font-size: 46px; font-weight: 600; letter-spacing: -0.028em; color: #1B1E23; line-height: 1;">Novi</div>
      <div style="font-size: 15px; color: #6A707A; letter-spacing: 0.005em;">The internet, as your classroom</div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-size: 12px; font-weight: 500; color: #B0B5BF;">Tap to skip</div>
</div>
</x-dc>
</body>
</html>

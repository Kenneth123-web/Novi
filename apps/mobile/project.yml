name: Novi
options:
  bundleIdPrefix: luke.novi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Configs/Base.xcconfig
  Release: Configs/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en

targets:
  Novi:
    type: application
    platform: iOS
    sources:
      - path: Novi
    # An explicit Info.plist rather than GENERATE_INFOPLIST_FILE: the generated
    # one is driven by INFOPLIST_KEY_* build settings, which are flat strings,
    # and there is no INFOPLIST_KEY_ spelling for NSAppTransportSecurity. The
    # API runs over plain HTTP on localhost in development. xcodegen writes this
    # file, so it stays gitignored and is regenerated with the project.
    info:
      path: Novi/Info.plist
      properties:
        CFBundleDisplayName: Novi
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        # Instrument Sans (SIL Open Font License). Registered here rather than
        # loaded at runtime: UIAppFonts is read once at launch, so a face named
        # in code but missing from this list silently falls back to the system
        # font and the whole type ramp shifts.
        UIAppFonts: [InstrumentSans.ttf]
        # Loopback only. A blanket NSAllowsArbitraryLoads would ship as "this
        # app accepts any plaintext HTTP", which is both a review question and
        # untrue: every other host it talks to is HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        # Device builds talk to the Mac over the LAN. Without this string
        # iOS never prompts, and HTTP to the host IP fails closed.
        NSLocalNetworkUsageDescription: Novi talks to the API on your Mac.
        # Filled from Configs/Local.xcconfig at build time. Empty on a
        # fresh clone, which keeps the simulator on loopback.
        NOVAPIBaseURL: $(NOV_API_BASE_URL)
        NOVAPIUsbURL: $(NOV_API_USB_URL)
        NOVAPIHostURL: $(NOV_API_HOST_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: luke.novi.app
        PRODUCT_NAME: Novi
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Single 1024×1024 in Assets.xcassets/AppIcon.appiconset. iOS
        # generates the home-screen sizes; without this name the catalog
        # compiles and the device still shows the default white icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        # Signing. A device build MUST be signed — an unsigned .app installs
        # nowhere. The simulator needs no signature and no team, which is what
        # keeps `xcodebuild -sdk iphonesimulator` working on a machine that has
        # never seen this project's provisioning.
        #
        # These were once unscoped `CODE_SIGNING_ALLOWED: NO`, and that is
        # exactly the "The executable is not codesigned" failure: automatic
        # signing provisions the target correctly, then the build is told not
        # to sign, and installd rejects the bundle.
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
        # Ad-hoc for the simulator, NOT unsigned. An unsigned app has no
        # entitlements at all, so it has no keychain access group, and every
        # SecItemAdd fails with errSecMissingEntitlement — which showed up as
        # "sign in again" on every launch. Ad-hoc ("-") needs no team and no
        # provisioning profile, so a machine that has never seen this project's
        # signing can still build and run it.
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        # DEVELOPMENT_TEAM comes from Configs/Local.xcconfig, which is
        # gitignored — a team id is per-person, and a device build under
        # somebody else's Apple ID cannot register this bundle id anyway.

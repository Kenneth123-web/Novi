# Migrations for the Novi database.
#
#   .venv/bin/alembic -c database/alembic.ini upgrade head
#   .venv/bin/alembic -c database/alembic.ini revision --autogenerate -m "..."
#
# No URL here on purpose: env.py reads DATABASE_URL through the API's own
# Settings, so a migration cannot be applied to a different database than the
# service is about to talk to.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
